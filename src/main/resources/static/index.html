<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Movies</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; }
        form { margin-bottom: 1.5rem; }
        input, button { padding: 0.5rem; font-size: 1rem; }
        ul { list-style: none; padding: 0; }
        li { margin-bottom: 1rem; }
        .title { font-weight: bold; }
        .desc { margin-left: 1rem; color: #555; }
    </style>
</head>
<body>
<h1>Movies</h1>

<!-- Add‑movie form -->
<form id="addMovieForm">
    <input id="newTitle" placeholder="New movie title" required/>
    <input id="newRating" type="number" placeholder="Rating (1-10)" min="1" max="10" step="0.1" required/>
    <button type="submit">Add Movie</button>
</form>

<!-- List of movies -->
<ul id="movieList">
    <li>Loading…</li>
</ul>

<script>
    // Fetch & render all movies
    async function loadMovies() {
      const res = await fetch('/movies');
      const movies = await res.json();
      const ul = document.getElementById('movieList');
      ul.innerHTML = '';

      if (!movies.length) {
        ul.innerHTML = '<li>No movies yet</li>';
        return;
      }

      movies.forEach(m => {
        const li = document.createElement('li');

        const title = document.createElement('div');
        title.textContent = m.title;
        title.className = 'title';

        const desc = document.createElement('div');
        desc.textContent = m.description || 'PLACEHOLDER / ERROR';
        desc.className = 'desc';

        const rating = document.createElement('div');
        rating.textContent = `Rating: ${m.rating || 'N/A'}`;
        rating.className = 'rating';

        li.appendChild(title);
        li.appendChild(desc);
        li.appendChild(rating);
        ul.appendChild(li);
      });
    }

    // Handle form submit to add a new movie
    document
      .getElementById('addMovieForm')
      .addEventListener('submit', async e => {
        e.preventDefault();
        const input = document.getElementById('newTitle');
        const ratingInput = document.getElementById('newRating');

        const title = input.value.trim();
        const rating = parseFloat(ratingInput.value);
        if (!title || isNaN(rating)) return;

        // POST to /movies
        await fetch('/movies', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, rating })
        });

        input.value = '';
        ratingInput.value = '';
        loadMovies();
      });

    // On page load
    window.addEventListener('DOMContentLoaded', loadMovies);
</script>
</body>
</html>
